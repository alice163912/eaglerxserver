name: Build EaglerXServer

on:
  push:
    branches:
      - feature/tunnl-gg-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build combined plugin JAR
        run: bash ./gradlew :core:shadowJar --no-daemon
