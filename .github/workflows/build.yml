name: Build EaglerXServer

on:
  push:
    branches:
      - feature/tunnl-gg-integration
  workflow_dispatch:

concurrency:
  group: eaglerxserver-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build combined plugin JAR
        run: bash ./gradlew :core:shadowJar --no-daemon
      - name: Upload built JAR
        uses: actions/upload-artifact@v4
        with:
          name: EaglerXServer-tunnl-gg
          path: core/build/libs/EaglerXServer.jar
          if-no-files-found: error
          retention-days: 14
